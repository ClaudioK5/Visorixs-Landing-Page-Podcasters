<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Visorixs — upload your Reel or TikTok and get specific, professional-style feedback based on the real content of your video."
    />
    <meta name="theme-color" content="#fff9c2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Visorixs — Your AI creator consultant for every Reel</title>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "") || "/";
        if (path === "/podcasts") {
          document.title =
            "Visorix for Podcasts — Understand an entire podcast without rewatching it";
          var desc = document.querySelector('meta[name="description"]');
          if (desc) {
            desc.setAttribute(
              "content",
              "Upload a podcast episode and let Visorix find discussions, timestamps, summaries, highlights and answers — without rewatching the recording."
            );
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
